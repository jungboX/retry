[project]
name = "retry-agent"
version = "0.1.0"
description = "Python agent service for natural-language job analysis and matching workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "agent-framework>=1.0.0",
  "github-copilot-sdk>=1.0.0",
  "mcp>=1.9.0",
  "tzdata>=2024.1"
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
