openapi: 3.0.3
info:
  title: Cheongdo Farm Work Matching API
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /api/jobs/analyze:
    post:
      summary: 자연어 작업 요청을 분석하고 후보를 추천
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawRequest]
              properties:
                rawRequest:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '200':
          description: 조건 분석과 추천 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/jobs:
    post:
      summary: 사용자가 확인한 분석 결과로 데모 작업 생성
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysisId]
              properties:
                analysisId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: 작업과 추천 후보 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedJob'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/jobs/{jobId}/matches:
    get:
      summary: 작업의 추천 후보 조회
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 점수순 후보 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/jobs/{jobId}/safety-confirm:
    post:
      summary: 작업 안전 확인 기록
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
      responses:
        '200':
          description: 안전 확인 상태
          content:
            application/json:
              schema:
                type: object
                required: [jobId, safetyConfirmed, status]
                properties:
                  jobId:
                    type: string
                  safetyConfirmed:
                    type: boolean
                  status:
                    type: string
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/matches/{matchId}/farmer-approve:
    post:
      summary: 농가 승인
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 농가 승인 후 매칭 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/matches/{matchId}/worker-accept:
    post:
      summary: 구직자 수락
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 구직자 수락 후 매칭 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/demo/state:
    get:
      summary: 현재 브라우저 데모 세션의 상태 조회
      parameters:
        - $ref: '#/components/parameters/DemoSessionId'
      responses:
        '200':
          description: 현재 데모 작업과 매칭 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoState'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /actuator/health:
    get:
      summary: API 헬스 체크
      responses:
        '200':
          description: 서비스 정상

components:
  parameters:
    DemoSessionId:
      in: header
      name: X-Demo-Session-Id
      required: true
      description: 브라우저별 데모 상태 격리를 위한 임의 UUID
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: 처리할 수 없는 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Job:
      type: object
      required: [workType, location, startDate, endDate, workersNeeded, dailyPay, hazardFlags, missingFields]
      properties:
        workType:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        workersNeeded:
          type: integer
          minimum: 1
          nullable: true
        dailyPay:
          type: integer
          minimum: 1
          nullable: true
        mealProvided:
          type: boolean
          nullable: true
        hazardFlags:
          type: array
          items:
            type: string
        missingFields:
          type: array
          items:
            type: string
        safetyReview:
          type: object
          properties:
            riskLevel:
              type: string
            requiredChecks:
              type: array
              items:
                type: string
            confirmationRequired:
              type: boolean
    RecommendedWorker:
      type: object
      required: [workerId, nickname, score, scoreReasons]
      properties:
        workerId:
          type: string
        nickname:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        scoreReasons:
          type: array
          items:
            type: string
    Analysis:
      type: object
      required: [job, recommendedWorkers, status, explanation]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        recommendedWorkers:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedWorker'
        status:
          type: string
          enum: [AWAITING_INPUT, NO_CANDIDATES, CANDIDATES_READY]
        explanation:
          type: string
    AnalysisResponse:
      type: object
      required: [analysisId, analysis]
      properties:
        analysisId:
          type: string
          format: uuid
        analysis:
          $ref: '#/components/schemas/Analysis'
    Match:
      type: object
      required: [id, jobId, workerId, nickname, totalScore, scoreReasons, farmerApproved, workerAccepted, status]
      properties:
        id:
          type: string
        jobId:
          type: string
        workerId:
          type: string
        nickname:
          type: string
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
        scoreReasons:
          type: array
          items:
            type: string
        farmerApproved:
          type: boolean
        workerAccepted:
          type: boolean
        status:
          type: string
          enum: [CANDIDATES_READY, FARMER_APPROVED, CONFIRMED]
    CreatedJob:
      type: object
      required: [id, status, job, matches, safetyConfirmed]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [CANDIDATES_READY, NO_CANDIDATES]
        job:
          $ref: '#/components/schemas/Job'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        safetyConfirmed:
          type: boolean
    DemoState:
      type: object
      required: [jobId, job, safetyConfirmed, matches]
      properties:
        jobId:
          type: string
          nullable: true
        job:
          allOf:
            - $ref: '#/components/schemas/Job'
          nullable: true
        safetyConfirmed:
          type: boolean
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
    Error:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
