openapi: 3.0.3
info:
  title: Retry API
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /api/jobs/analyze:
    post:
      summary: 자연어 작업 요청을 구조화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobAnalysisRequest'
      responses:
        '200':
          description: 구조화된 작업 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAnalysisResponse'

  /api/jobs:
    post:
      summary: 작업 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: 작업 생성 성공

  /api/jobs/{jobId}/matches:
    get:
      summary: 작업 후보 목록 조회
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 후보 목록

  /api/matches/{matchId}/farmer-approve:
    post:
      summary: 농가 승인
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 승인 처리 완료

  /api/matches/{matchId}/worker-accept:
    post:
      summary: 구직자 수락
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 수락 처리 완료

  /api/demo/state:
    get:
      summary: 데모 상태 조회
      responses:
        '200':
          description: 현재 데모 상태

  /actuator/health:
    get:
      summary: 헬스 체크
      responses:
        '200':
          description: 서비스 정상

components:
  schemas:
    JobAnalysisRequest:
      type: object
      required: [rawRequest]
      properties:
        rawRequest:
          type: string

    JobAnalysisResponse:
      type: object
      properties:
        workType:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workersNeeded:
          type: integer
        dailyPay:
          type: integer
        mealProvided:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
        hazardFlags:
          type: array
          items:
            type: string

    JobCreateRequest:
      type: object
      required: [workType, location, startDate, endDate]
      properties:
        workType:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workersNeeded:
          type: integer
        dailyPay:
          type: integer
        mealProvided:
          type: boolean
        hazardFlags:
          type: array
          items:
            type: string
